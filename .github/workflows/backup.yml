# Backup diario de la base de datos (§3 del plan, ADR-2).
#
# El plan gratuito de Supabase no incluye copias de seguridad. Con la familia
# dentro, eso significa que un error deja los datos irrecuperables. Este
# workflow vuelca la base entera cada día y guarda el fichero como artefacto.
#
# Un backup sin restauración probada no es un backup: el DoD del §8 exige
# restaurar uno al menos una vez. Ver README, sección "Restaurar un backup".
name: backup

on:
  schedule:
    # 04:37 UTC a diario, antes del keep-alive: si el volcado falla, el ping
    # posterior mantiene el proyecto vivo igualmente.
    - cron: "37 4 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        # El runner trae el cliente 16 y pg_dump se niega a volcar una base de
        # datos de versión superior.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar la base de datos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          # Instalar el paquete NO basta: /usr/bin/pg_dump lo gestiona pg_wrapper
          # de postgresql-common, que resuelve a la versión *por defecto* del
          # sistema (la 16), no a la más reciente instalada. Hay que llamar al
          # binario versionado por su ruta. Se elige el mayor disponible para que
          # esto siga funcionando cuando Supabase actualice de versión mayor.
          PGDUMP=$(ls -d /usr/lib/postgresql/*/bin/pg_dump 2>/dev/null | sort -V | tail -1)
          test -n "$PGDUMP" || { echo "No hay ningún pg_dump versionado instalado"; exit 1; }
          echo "Usando $PGDUMP"
          "$PGDUMP" --version

          stamp=$(date -u +%Y%m%d-%H%M)
          # --no-owner y --no-privileges: el volcado se restaura en cualquier
          # proyecto sin arrastrar los roles concretos del original.
          "$PGDUMP" "$DB_URL" \
            --no-owner --no-privileges \
            --schema=public --schema=storage \
            | gzip -9 > "marginalia-${stamp}.sql.gz"
          ls -lh marginalia-*.sql.gz
          # Un volcado de menos de 1 KB casi seguro es un fallo silencioso.
          test "$(stat -c%s marginalia-${stamp}.sql.gz)" -gt 1024

      - name: Guardar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: marginalia-*.sql.gz
          # 90 días es el máximo de GitHub. Suficiente para la ventana de
          # evaluación del §0; si el proyecto sobrevive, ver BACKLOG.md.
          retention-days: 90
          if-no-files-found: error
